<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта нахождения медицинских бригад</title>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=%YANDEX_API_KEY%&lang=ru_RU" type="text/javascript"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .brigade-balloon {
            padding: 8px;
            min-width: 200px;
        }
        .brigade-title {
            font-weight: bold;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 6px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 4px;
        }
        .brigade-info {
            font-size: 13px;
            color: #555;
            margin: 4px 0;
        }
        .brigade-status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            color: white;
            font-size: 11px;
            font-weight: bold;
            margin-top: 6px;
        }
        .status-active { background-color: #2ecc71; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script>
        let myMap;
        let brigades = {}; // Хранилище бригад по ID 
        let stations = {}; // Хранилище cтанций по ID 

        // Инициализация карты
        ymaps.ready(initMap);
        
        function initMap() {
            myMap = new ymaps.Map('map', {
                center: [55.821811, 37.514374], // Москва
                zoom: 11,
                controls: ['zoomControl', 'fullscreenControl', 'typeSelector']
            });
            
            console.log('Карта инициализирована');
        }
        
	// Очистка всех объектов на карте
        function clearMap() {
            clearBrigades();
            clearStations();
            console.log('Карта очищена');
        }

        // ==========================================
        // Скрипт работы с бригадами СМП
        // ==========================================

        
        // Добавление бригады на карту
        function addBrigade(id, lat, lon, label, iconUrl) {
            if (!myMap) {
                console.error('Карта не инициализирована');
                return;
            }
            
            // Удаление старой бригады, если она уже существует
            if (brigades[id]) {
                myMap.geoObjects.remove(brigades[id]);
            }
            
            // Базовые опции маркера
            let placemarkOptions = {
                draggable: false
            };

            // Проверка кастомной картинки
            if (iconUrl && iconUrl !== '') {
                placemarkOptions.iconLayout = 'default#image';
                placemarkOptions.iconImageHref = iconUrl;
                placemarkOptions.iconImageSize = [32, 32];
                placemarkOptions.iconImageOffset = [-16, -32]; // Центр по X, низ по Y
            } else {
                // Стандартный маркер Яндекса, если картинка не задана
                placemarkOptions.preset = 'islands#blueMedicalIcon';
            }
            
            // Создание маркера с динамическими опциями
            let placemark = new ymaps.Placemark(
                [lat, lon],
                {
                    hintContent: label,
                    balloonContent:
                        '<div class="brigade-balloon">' +
                        '<div class="brigade-title">🚑 ' + label + '</div>' +
                        '<div class="brigade-info"><b>ID:</b> ' + id + '</div>' +
                        '<div class="brigade-info"><b>Координаты:</b> ' + lat.toFixed(4) + ', ' + lon.toFixed(4) + '</div>' +
                        '<span class="brigade-status status-active">Подстанция СМП N24</span>' +
                        '</div>'
                },
                placemarkOptions
            );
            
            // Обработчик клика по маркеру
            placemark.events.add('click', function(e) {
                //let message = "brigade:" + id        //TO-DO     
                let message = id                
                console.log('Клик по маркеру:', message);
                
                // Отправка сообщения в клиент Delphi
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(message);
                }
            });
            
            // Добавляем маркер на карту и сохраняем в массив
            myMap.geoObjects.add(placemark);
            brigades[id] = placemark; // Было markers[id]
            
            console.log('Добавлена бригада:', id, label, 'координаты:', lat, lon);
        }
        
        // Обновление позиции бригады
        function updateBrigadePosition(id, lat, lon) {
            if (brigades[id]) { 
                brigades[id].geometry.setCoordinates([lat, lon]); 
                console.log('Обновлена позиция бригады:', id);
            }
        }
        
        // Удаление конкретной бригады
        function removeBrigade(id) {
            if (brigades[id]) { 
                myMap.geoObjects.remove(brigades[id]); 
                delete brigades[id]; 
                console.log('Удалена бригада:', id);
            }
        }

       // Очистка бригад
        function clearBrigades() {
            for (let id in brigades) {
                if (brigades.hasOwnProperty(id)) {
                    myMap.geoObjects.remove(brigades[id]);
                }
            }
            brigades = {};
            console.log('Бригады удалены с карты');
        }
        
        // Центрирование карты на бригаде --
        function focusOnBrigade(id) {
            if (brigades[id]) { 
                let coords = brigades[id].geometry.getCoordinates(); 
                myMap.setCenter(coords, 15);
                brigades[id].balloon.open(); 
            }
        }


        // ==========================================
        // Скрипт работы со станциями СМП
        // ==========================================

        // Добавление станции на карту
        function addStation(id, lat, lon, label, iconUrl) {
            if (!myMap) {
                console.error('Карта не инициализирована');
                return;
            }
            
            // Удаление старой станции, если она уже существует
            if (stations[id]) {
                myMap.geoObjects.remove(stations[id]);
            }
            
            // Базовые опции маркера
            let placemarkOptions = {
                draggable: false
            };

            // Проверка кастомной картинки
            if (iconUrl && iconUrl !== '') {
                placemarkOptions.iconLayout = 'default#image';
                placemarkOptions.iconImageHref = iconUrl;
                placemarkOptions.iconImageSize = [32, 32];
                placemarkOptions.iconImageOffset = [-16, -32]; // Центр по X, низ по Y
            } else {
                // Стандартный маркер Яндекса, если картинка не задана
                placemarkOptions.preset = 'islands#redMedicalIcon';
            }
            
            // Создание маркера с динамическими опциями
            let placemark = new ymaps.Placemark(
                [lat, lon],
                {
                    hintContent: label,
                    balloonContent:
                        '<div class="brigade-balloon">' +
                        '<div class="brigade-title">🏥 ' + label + '</div>' +
                        '<div class="brigade-info"><b>ID Станции:</b> ' + id + '</div>' +
                        '<div class="brigade-info"><b>Координаты:</b> ' + lat.toFixed(4) + ', ' + lon.toFixed(4) + '</div>' +
                        '</div>'
                },
                placemarkOptions
            );
            
            // Обработчик клика по маркеру
            placemark.events.add('click', function(e) {                
                let message = "station:" + id
                console.log('Клик по маркеру станции:', message);
                
                // Отправка сообщения в клиент Delphi
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(message);
                }
            });
            
            // Добавляем маркер на карту и сохраняем в массив
            myMap.geoObjects.add(placemark);
            stations[id] = placemark; 
            
            console.log('Добавлена станция:', id, label, 'координаты:', lat, lon);
        }

  	// Удаление конкретной станции
        function removeStation(id) {
            if (stations[id]) { 
                myMap.geoObjects.remove(stations[id]); 
                delete stations[id]; 
                console.log('Удалена станция:', id);
            }
        }


        // Очистка станций
        function clearStations() {
            for (let id in stations) {
                if (stations.hasOwnProperty(id)) {
                    myMap.geoObjects.remove(stations[id]);
                }
            }
            stations = {};
            console.log('Станции удалены с карты');
        }
        
        // Центрирование карты на станции
        function focusOnStation(id) {
            if (stations[id]) { 
                let coords = stations[id].geometry.getCoordinates(); 
                myMap.setCenter(coords, 15);
                stations[id].balloon.open(); 
            }
        }



    </script>
</body>
</html>
